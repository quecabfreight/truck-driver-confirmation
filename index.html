<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#000000" />
    <title>QueCab AdbS — Secure Your Load</title>

    <style>
      /* Default variables (light as baseline) */
      :root {
        --bg: #eef1f4;
        --card: #ffffff;
        --plate: rgba(255,255,255,0.85);
        --text: #0b0e11;
        --muted: #5e6672;
        --border: rgba(15, 23, 42, 0.08);
        --accent: #0b0e11;
      }

      /* Force LIGHT theme when <html class="light"> */
      html.light {
        --bg: #eef1f4;
        --card: #ffffff;
        --plate: rgba(255,255,255,0.85);
        --text: #0b0e11;
        --muted: #5e6672;
        --border: rgba(15, 23, 42, 0.08);
        --accent: #0b0e11;
      }

      /* Force DARK theme when <html class="dark"> */
      html.dark {
        --bg: #000000;
        --card: #0f0f10;
        --plate: rgba(0,0,0,0.75);
        --text: #f4f6f8;
        --muted: #a1a7b0;
        --border: rgba(255, 255, 255, 0.10);
        --accent: #111315;
      }

      /* Readable base sizes */
      html { font-size: 17px; }
      @media (max-width: 680px) { html { font-size: 16px; } }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a { color: inherit; }
      a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 2px solid rgba(80,130,255,0.35);
        outline-offset: 2px;
        border-radius: 8px;
      }

      #root, #app { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
