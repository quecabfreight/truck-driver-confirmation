<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueCab AdbS — Secure Your Load</title>
    <meta name="color-scheme" content="dark light" />

    <style>
      /* Global theme tokens (dark/light) driven by html[data-theme] */
      :root {
        --bg: #0b0d10;
        --card: #14181f;
        --border: rgba(255,255,255,0.10);
        --text: #e7edf6;
        --muted: rgba(231,237,246,0.70);
        --accent: #e74c3c; /* not used here, but reserved */
      }
      html[data-theme="light"] {
        --bg: #eef1f5;
        --card: #ffffff;
        --border: rgba(15,23,42,0.12);
        --text: #0e1320;
        --muted: rgba(14,19,32,0.65);
      }

      /* Base reset + body background from theme */
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Optional: minimal focus ring for accessibility */
      :focus-visible {
        outline: 2px solid rgba(99, 102, 241, 0.8);
        outline-offset: 2px;
      }
    </style>

    <script>
      // Apply saved theme early (no flash)
      (function() {
        try {
          var saved = localStorage.getItem("qc_theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
      // Global helper the React button can call
      window.__qcToggleTheme = function() {
        var html = document.documentElement;
        var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        try { localStorage.setItem("qc_theme", next); } catch (e) {}
        return next;
      };
      window.__qcGetTheme = function() {
        var html = document.documentElement;
        return html.getAttribute("data-theme") || "dark";
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
