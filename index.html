    <script>
      (function () {
        function show(msg) {
          try {
            var box = document.getElementById("qc-boot-error");
            var pre = document.getElementById("qc-boot-msg");

            if (!box || !pre) return;

            pre.textContent = String(msg || "Unknown startup error.");
            box.style.display = "block";
          } catch {}
        }

        window.addEventListener("error", function (e) {
          var message =
            (e && (e.message || (e.error && e.error.message))) ||
            "Script error.";

          show(message);
        });

        window.addEventListener("unhandledrejection", function (e) {
          var reason = e && e.reason;

          show(
            (reason && reason.message) ||
              String(reason || "Unhandled promise rejection."),
          );
        });

        setTimeout(function () {
          var root = document.getElementById("root");

          if (root && !root.hasChildNodes()) {
            show(
              "App did not start (root stayed empty). Likely a startup crash.",
            );
          }
        }, 2500);
      })();
    </script>

  <body>
