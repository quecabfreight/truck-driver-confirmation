<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="theme-color" content="#000000" />
    <title>QueCab AdbS — Secure Your Load</title>

    <style>
      :root {
        /* LIGHT THEME (app-wide) */
        --bg: #eef1f4;         /* full-page background (the grey you prefer) */
        --card: #ffffff;       /* cards/panels */
        --plate: rgba(255,255,255,0.85);
        --text: #0b0e11;
        --muted: #5e6672;
        --border: rgba(15, 23, 42, 0.08);
        --accent: #0b0e11;
      }
      :root.dark {
        /* DARK THEME (app-wide) */
        --bg: #000000;         /* true black page background */
        --card: #0f0f10;       /* panels */
        --plate: rgba(0,0,0,0.75);
        --text: #f4f6f8;
        --muted: #a1a7b0;
        --border: rgba(255, 255, 255, 0.10);
        --accent: #111315;
      }

      /* Base typography sizing (bigger, readable) */
      html { font-size: 17px; }     /* desktop default */
      @media (max-width: 680px) {
        html { font-size: 16px; }   /* mobile base */
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Make anchor focus nice & subtle */
      a { color: inherit; }
      a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 2px solid rgba(80,130,255,0.35);
        outline-offset: 2px;
        border-radius: 8px;
      }

      /* Root app mount */
      #root, #app { min-height: 100vh; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
