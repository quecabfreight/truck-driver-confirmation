<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueCab AdbS</title>

    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #0f1722;
        color: #e6edf5;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      #qc-fallback {
        display: none;
        min-height: 100vh;
        padding: 18px 16px;
      }
      .card {
        max-width: 980px;
        margin: 0 auto;
        border: 1px solid rgba(255,90,90,0.35);
        background: rgba(0,0,0,0.25);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 16px 34px rgba(0,0,0,0.30);
      }
      .title { font-size: 18px; font-weight: 950; margin: 0 0 6px; }
      .sub { font-size: 13px; opacity: 0.75; margin: 0 0 12px; }
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        white-space: pre-wrap;
        line-height: 1.35;
        margin: 0;
        opacity: 0.9;
      }
      .hint { margin-top: 12px; font-size: 13px; opacity: 0.75; }
      .btn {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(140,190,255,0.20);
        background: rgba(0,0,0,0.18);
        color: #e6edf5;
        font-weight: 900;
        letter-spacing: 0.2px;
        text-decoration: none;
      }
    </style>

    <script>
      // If JS bundle fails or throws early, show a visible error instead of a white page.
      (function () {
        function show(msg) {
          try {
            var el = document.getElementById("qc-fallback");
            var pre = document.getElementById("qc-fallback-msg");
            if (!el || !pre) return;
            pre.textContent = String(msg || "Unknown startup error.");
            el.style.display = "block";
          } catch {}
        }

        window.addEventListener("error", function (e) {
          show((e && (e.message || (e.error && e.error.message))) || "Script error.");
        });

        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          show((r && r.message) || String(r || "Unhandled promise rejection."));
        });

        // If React doesn't mount quickly, show a hint.
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root) return;
          // If root is still empty after 2.5s, we probably failed to boot.
          if (!root.hasChildNodes()) {
            show("App did not start. Likely missing /assets JS file or a startup crash.");
          }
        }, 2500);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <div id="qc-fallback">
      <div class="card">
        <div class="title">QueCab AdbS — Startup Error</div>
        <div class="sub">Instead of a blank white page, here’s what went wrong:</div>
        <pre id="qc-fallback-msg">(waiting…)</pre>
        <div class="hint">
          If this says “missing /assets JS file”, go to Vercel and Redeploy with “Clear build cache”.
        </div>
        <a class="btn" href="/#/">
          Back Home
        </a>
      </div>
    </div>

    <script type="module" crossorigin src="/assets/index-RQjVk0yp.js"></script>
  </body>
</html>
