<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueCab Ads</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: url('qc-hero-landing.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      color: white;
    }

    header {
      background-color: #444;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .logo {
      height: 40px;
    }

    .spacer {
      height: 70px; /* to offset fixed header */
    }

    /* Optional: Add responsiveness */
    @media screen and (max-width: 768px) {
      .nav-links {
        font-size: 14px;
      }
      .logo {
        height: 30px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="site.html">
      <img src="qclogo.png" alt="QueCab Ads Logo" class="logo" />
    </a>
    <nav class="nav-links">
      <a href="site.html">Home</a>
      <a href="request.html">Request Access</a>
      <a href="login.html">Login</a>
      <a href="checkin.html">Check In</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <div class="spacer"></div>

</body>
</html>
