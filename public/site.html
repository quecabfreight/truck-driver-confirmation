<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueCab Adbs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: url('qc-hero-landing.jpg') no-repeat center center;
      background-size: contain;
      background-color: black;
      height: 100vh;
      color: white;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: transparent;
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    .logo img {
      height: 60px;
    }

    .hero-text {
      text-align: center;
      margin-top: 40vh;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
    }

    @media (max-width: 768px) {
      .logo img {
        height: 40px;
      }

      .nav-links a {
        margin-left: 10px;
        font-size: 0.9rem;
      }

      .hero-text h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">
      <a href="site.html">
        <img src="qc-logo.png" alt="QueCab Logo" />
      </a>
    </div>
    <div class="nav-links">
      <a href="site.html">Home</a>
      <a href="request-access.html">Request Access</a>
      <a href="login.html">Login</a>
      <a href="check-in.html">Check In</a>
      <a href="about.html">About</a>
    </div>
  </div>

  <div class="hero-text">
    <h1>1 LINK &nbsp;·&nbsp; 3 CHECKS &nbsp;·&nbsp; INSTANT VERIFICATION</h1>
  </div>
</body>
</html>
