<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AdbS Truck-Driver Verification</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#0c121c;
color:#e6edf5;
margin:0;
padding:30px;
text-align:center;
}

.container{
max-width:700px;
margin:auto;
background:rgba(255,255,255,0.05);
border-radius:16px;
padding:28px;
border:1px solid rgba(255,255,255,0.15);
}

input{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:16px;
border-radius:10px;
border:1px solid rgba(255,255,255,0.15);
background:rgba(255,255,255,0.05);
color:#fff;
font-size:18px;
text-align:center;
}

button{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid rgba(120,180,255,0.45);
background:rgba(40,110,190,0.35);
color:#fff;
font-size:18px;
font-weight:900;
cursor:pointer;
}

.result{
margin-top:24px;
font-size:34px;
font-weight:900;
}

.clear{
color:#6fff8d;
}

.caution{
color:#ff4d4d;
}

.flash{
animation:flashbg 0.7s infinite;
}

@keyframes flashbg{
0%{background:#0c121c}
50%{background:#3a0000}
100%{background:#0c121c}
}

.soundToggle{
margin-top:12px;
font-size:14px;
opacity:.8;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>AdbS TRUCK-DRIVER VERIFICATION</h2>

<p>Enter the USDOT# and Plate shown on the truck.</p>

<input id="usdot" placeholder="USDOT#" />
<input id="plate" placeholder="Plate" />

<button onclick="verify()">Verify Truck-Driver</button>

<div id="result" class="result"></div>

<div class="soundToggle" onclick="toggleSound()">
🔊 Alert Sound: <span id="soundState">ON</span>
</div>

</div>

<audio id="alertSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>

let soundEnabled=true

function toggleSound(){
soundEnabled=!soundEnabled
document.getElementById("soundState").innerText=soundEnabled?"ON":"OFF"
}

function getToken(){
const params=new URLSearchParams(location.search)
return params.get("t")
}

async function verify(){

const token=getToken()

const usdot=document.getElementById("usdot").value.trim()
const plate=document.getElementById("plate").value.trim()

const res=await fetch("/api/verify_driver",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
token,
entered_usdot:usdot,
entered_plate:plate
})
})

const data=await res.json()

const result=document.getElementById("result")

if(!res.ok){
result.innerText="Verification Error"
result.className="result caution"
return
}

if(data.result==="clear"){

result.innerText="CLEAR TO LOAD"
result.className="result clear"

}else{

document.body.classList.add("flash")

if(soundEnabled){
document.getElementById("alertSound").play()
}

result.innerText="CAUTION — DO NOT LOAD"
result.className="result caution"

}

}

</script>

</body>
</html>
