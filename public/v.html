<!-- /public/v.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QueCab AdbS — Verify</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0f1722;color:#e6edf5}
      .wrap{max-width:760px;margin:0 auto;padding:24px}
      .card{border:1px solid rgba(140,190,255,0.14);background:rgba(0,0,0,0.22);border-radius:14px;padding:16px}
      .h{font-weight:900;font-size:18px;margin:0 0 8px}
      .p{opacity:.8;margin:0}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="h">Opening verification…</div>
        <p class="p">
          If you are not redirected automatically, this link may be missing a token.
        </p>
        <p class="p" style="margin-top:10px">
          Token: <span class="mono" id="tok">(loading)</span>
        </p>
      </div>
    </div>

    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search || "");
          var t = (params.get("t") || "").trim();
          document.getElementById("tok").textContent = t || "(missing)";
          if (!t) return;

          // HashRouter target
          var dest = "/#/verify/" + encodeURIComponent(t);
          window.location.replace(dest);
        } catch (e) {
          // do nothing; page stays readable
        }
      })();
    </script>
  </body>
</html>
